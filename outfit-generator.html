<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050b13">
  <title>Z.E.R.O. — Outfit Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
  <link rel="stylesheet" href="./outfit-generator.css?v=showroom-wide-visible-5">
</head>
<body>
  <div id="outfitLab">
    <header class="topbar">
      <button class="back-button" id="backButton" type="button" aria-label="Return to Z.E.R.O.">
        <span class="back-arrow">←</span><span>RETURN TO Z.E.R.O.</span>
      </button>
      <div class="brand">
        <span class="brand-mark">Z.</span>
        <span class="brand-copy"><strong>OUTFIT LAB</strong><small>HOLOGRAPHIC STYLING SYSTEM</small></span>
      </div>
      <div class="top-actions">
        <span id="engineStatus" hidden>STYLE ENGINE READY</span>
        <label class="avatar-upload" for="avatarFile">CUSTOM AVATAR <span>＋</span></label>
        <input id="avatarFile" type="file" accept=".glb,model/gltf-binary" hidden>
        <button class="reset-avatar" id="resetAvatar" type="button">RESET MODEL</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="composer" aria-label="Outfit controls">
        <textarea id="outfitBrief" rows="2" maxlength="700" aria-label="Describe an outfit" placeholder="Describe a look…"></textarea>
        <button class="generate-button" id="generateButton" type="button">
          <span class="generate-icon">✳</span><span class="generate-label">GENERATE</span><span class="generate-arrow">↗</span>
        </button>
        <div class="generation-status" id="generationStatus" role="status" aria-live="polite">READY</div>
      </aside>

      <section class="stage" id="stage" aria-label="Holographic outfit preview">
        <div class="room-glass room-back" aria-hidden="true"></div>
        <div class="room-glass room-left" aria-hidden="true"></div>
        <div class="room-glass room-right" aria-hidden="true"></div>
        <canvas id="scene" aria-label="Rotatable holographic avatar on a glass platform"></canvas>
        <div class="scene-fallback" id="sceneFallback" aria-hidden="true">
          <div class="fallback-wall fallback-wall-back"></div>
          <div class="fallback-wall fallback-wall-left"></div>
          <div class="fallback-wall fallback-wall-right"></div>
          <div class="fallback-floor-grid"></div>
          <div class="fallback-platform"><i></i><b></b></div>
          <svg class="fallback-avatar" viewBox="0 0 300 650" role="presentation">
            <defs><linearGradient id="holoBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5fbff" stop-opacity=".88"/><stop offset=".5" stop-color="#5dcfff" stop-opacity=".34"/><stop offset="1" stop-color="#167dce" stop-opacity=".68"/></linearGradient><filter id="holoGlow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
            <g fill="url(#holoBody)" stroke="#a9efff" stroke-width="2.2" filter="url(#holoGlow)">
              <circle cx="150" cy="62" r="39"/>
              <path d="M126 105 Q150 95 174 105 L198 132 225 250 197 267 180 187 183 305 117 305 120 187 103 267 75 250 102 132Z"/>
              <path d="M119 300 L181 300 190 405 169 420 150 405 131 420 110 405Z"/>
              <path d="M111 407 L145 407 137 555 105 555 96 425Z"/>
              <path d="M155 407 L189 407 204 555 195 555 163 555Z"/>
              <path d="M96 550 L139 550 134 590 78 590 Q70 580 82 564Z"/>
              <path d="M163 550 L203 550 225 575 Q231 590 217 590 L169 590Z"/>
            </g>
            <path d="M107 143 Q150 121 193 143 L180 300 120 300Z" fill="rgba(81,190,255,.2)" stroke="#b7f2ff" stroke-width="1.5"/>
            <path d="M112 307 L188 307 180 405 120 405Z" fill="rgba(47,132,205,.25)" stroke="#8bdfff" stroke-width="1.5"/>
            <path d="M150 102 V590" stroke="#d5faff" stroke-opacity=".25" stroke-dasharray="3 8"/>
          </svg>
        </div>
        <div class="transition-tiles" id="transitionTiles" aria-hidden="true"></div>
        <span id="stageTitle" hidden>HOLOGRAPHIC AVATAR</span>
      </section>
    </main>

    <footer class="look-rail">
      <div class="rail-label"><span class="eyebrow">03 / LOOK HISTORY</span><strong>YOUR LOOKS</strong></div>
      <div class="rail-controls">
        <button id="previousLook" type="button" aria-label="Previous look">←</button>
        <button id="autoplayLooks" type="button" aria-pressed="false">AUTO <i></i></button>
        <button id="nextLook" type="button" aria-label="Next look">→</button>
      </div>
      <div class="look-strip" id="lookStrip"><div class="empty-strip">GENERATED LOOKS WILL APPEAR HERE</div></div>
      <div class="rail-foot"><span id="historyCount">01 / 01</span><span>RECENT + SAVED LOOKS</span></div>
    </footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./outfit-generator.js?v=showroom-wide-visible-5"></script>
</body>
</html>
