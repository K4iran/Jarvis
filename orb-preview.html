<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <title>JARVIS Orb Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050508; color: #eaf5ff; }
    body { min-height: 100svh; }
    #orb { display: block; width: 100%; height: 100%; position: absolute; inset: 0; z-index: 0; }
    .vignette { position: absolute; z-index: 1; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.32) 100%); }
    .top { position: absolute; z-index: 2; top: max(18px, env(safe-area-inset-top)); left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .brand { letter-spacing: .22em; font-size: 11px; color: #a9cce7; opacity: .8; }
    .status { font-size: 11px; color: #8bbde2; text-transform: uppercase; letter-spacing: .16em; }
    .controls { position: absolute; z-index: 2; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(94vw, 620px); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    button { appearance: none; border: 1px solid rgba(105,180,230,.25); background: rgba(8,20,34,.72); color: #cce8ff; border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 12px; letter-spacing: .04em; backdrop-filter: blur(12px); cursor: pointer; }
    button.active { border-color: rgba(125,205,255,.8); background: rgba(38,105,155,.42); color: white; box-shadow: 0 0 18px rgba(55,155,230,.18); }
    button:focus-visible { outline: 2px solid #8bd1ff; outline-offset: 3px; }
    .hint { position: absolute; z-index: 2; bottom: max(82px, calc(env(safe-area-inset-bottom) + 78px)); left: 12px; right: 12px; text-align: center; color: rgba(180,215,240,.48); font-size: 10px; letter-spacing: .08em; pointer-events: none; }
    .error { position: absolute; z-index: 3; top: 58px; left: 50%; transform: translateX(-50%); width: min(92vw, 620px); padding: 9px 12px; border: 1px solid rgba(255,190,110,.35); border-radius: 10px; background: rgba(45,27,12,.88); color: #ffd7a8; font-size: 11px; line-height: 1.45; text-align: center; overflow-wrap: anywhere; }
    .error[hidden] { display: none; }
    @media (max-width: 420px) { button { padding: 9px 12px; font-size: 11px; } .brand, .status { font-size: 9px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="orb" aria-label="Animated particle network orb"></canvas>
  <div class="vignette"></div>
  <div class="top"><div class="brand">J.A.R.V.I.S. / ORB LAB</div><div class="status" id="status">LOADING</div></div>
  <div class="error" id="error" role="status" aria-live="polite" hidden></div>
  <div class="hint" id="hint">INITIALISING PARTICLE NETWORK</div>
  <div class="controls" aria-label="Orb preview controls">
    <button class="active" data-state="idle">Idle</button>
    <button data-state="listening">Listening</button>
    <button data-state="thinking">Thinking</button>
    <button data-state="speaking">Speaking</button>
    <button data-state="compacting">Compacting</button>
    <button id="mic">Enable mic</button>
  </div>
  <script type="module">
    const canvas = document.querySelector('#orb');
    const status = document.querySelector('#status');
    const hint = document.querySelector('#hint');
    const errorPanel = document.querySelector('#error');
    const buttons = [...document.querySelectorAll('[data-state]')];
    const micButton = document.querySelector('#mic');
    let orb = null;
    let audioContext = null;
    let microphoneStream = null;

    function showFailure(error) {
      const detail = error?.message || String(error || 'Unknown initialisation error');
      errorPanel.textContent = '3D renderer unavailable — showing compatibility preview. ' + detail;
      errorPanel.hidden = false;
      status.textContent = 'COMPATIBILITY MODE';
      console.error('JARVIS orb initialisation failed:', error);
    }

    // A lightweight 2D renderer keeps the preview visible if WebGL or the
    // Three.js CDN is unavailable on the device/browser.
    function createFallbackOrb(originalCanvas, options = {}) {
      const fallbackCanvas = document.createElement('canvas');
      fallbackCanvas.id = 'orb';
      fallbackCanvas.setAttribute('aria-label', 'Compatibility particle network orb');
      originalCanvas.replaceWith(fallbackCanvas);
      const ctx = fallbackCanvas.getContext('2d');
      if (!ctx) throw new Error('Canvas 2D is unavailable in this browser.');
      const profiles = {
        idle:       { radius: 1, speed: .20, links: .15, pulse: .15 },
        listening:  { radius: .86, speed: .30, links: .4, pulse: .4 },
        thinking:   { radius: .68, speed: .50, links: 1, pulse: .9 },
        speaking:   { radius: .76, speed: .20, links: .8, pulse: 1.15 },
        compacting: { radius: .48, speed: .08, links: 0, pulse: .05 }
      };
      const count = Math.min(520, Math.max(300, options.particleCount || 420));
      const particles = Array.from({ length: count }, () => {
        const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2;
        const r = Math.sqrt(1 - u * u);
        return { x: Math.cos(a) * r, y: u, z: Math.sin(a) * r, phase: Math.random() * 6.28, drift: .3 + Math.random() * .7 };
      });
      const edges = [];
      for (let i = 0; i < count; i++) {
        for (let j = i + 1; j < count; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x-b.x, dy = a.y-b.y, dz = a.z-b.z;
          if (dx*dx + dy*dy + dz*dz < .075 && Math.random() < .72) edges.push([i,j]);
        }
      }
      let state = 'idle', analyser = null, audioData = null, frame = 0, raf = 0, destroyed = false;
      let width = 1, height = 1, dpr = 1, last = performance.now();
      const projected = new Array(count);
      function resize() {
        const rect = fallbackCanvas.getBoundingClientRect();
        width = Math.max(1, rect.width); height = Math.max(1, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        fallbackCanvas.width = Math.round(width*dpr);
        fallbackCanvas.height = Math.round(height*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
      }
      resize();
      window.addEventListener('resize', resize);
      function draw(now) {
        if (destroyed) return;
        const dt = Math.min(.05, (now-last)/1000); last=now; frame++;
        const p = profiles[state], time = now*.001, pulse = .5 + .5*Math.sin(time*(state==='speaking'?5:state==='thinking'?3:1));
        let audio = 0;
        if (analyser && audioData) {
          analyser.getByteFrequencyData(audioData);
          for (let i=0;i<Math.min(12,audioData.length);i++) audio += audioData[i]/255;
          audio /= Math.min(12,audioData.length);
        }
        const breath = 1 + (state==='speaking'?.17:state==='thinking'?.09:.045)*Math.sin(time*(state==='speaking'?5:1.4)) + audio*.22;
        const radius = Math.min(width,height)*.34*p.radius*breath;
        const angle = time*p.speed*.35;
        const ca=Math.cos(angle), sa=Math.sin(angle);
        ctx.clearRect(0,0,width,height);
        const glow=ctx.createRadialGradient(width/2,height/2,0,width/2,height/2,radius*1.45);
        glow.addColorStop(0,'rgba(30,135,220,.18)'); glow.addColorStop(.55,'rgba(12,75,135,.08)'); glow.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=glow; ctx.fillRect(0,0,width,height);
        for(let i=0;i<count;i++){
          const q=particles[i], x=q.x*ca-q.z*sa, z=q.x*sa+q.z*ca;
          const y=q.y*Math.cos(angle*.32)-z*Math.sin(angle*.32);
          const zz=q.y*Math.sin(angle*.32)+z*Math.cos(angle*.32);
          const perspective=1/(1.65-zz*.42);
          projected[i]={x:width/2+x*radius*perspective,y:height/2+y*radius*perspective,z:zz,scale:perspective};
        }
        if(p.links>0){
          ctx.lineWidth=.65;
          for(const [a,b] of edges){
            const A=projected[a], B=projected[b], depth=(A.z+B.z)*.5;
            const alpha=p.links*(.035+Math.max(0,depth+.4)*.075)*(state==='thinking'?.95:1);
            if(alpha<.025) continue;
            ctx.strokeStyle='rgba(83,174,238,'+Math.min(.22,alpha)+')';
            ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
          }
        }
        for(let i=0;i<count;i++){
          const q=projected[i], twinkle=.55+.45*Math.sin(time*(1.2+particles[i].drift)+particles[i].phase);
          const size=(.65+q.scale*.65)*(state==='speaking'?1.08:1);
          ctx.fillStyle='rgba(155,220,255,'+(0.38+twinkle*.48)+')';
          ctx.beginPath();ctx.arc(q.x,q.y,size,0,Math.PI*2);ctx.fill();
        }
        ctx.save();ctx.globalCompositeOperation='lighter';
        const core=ctx.createRadialGradient(width/2,height/2,0,width/2,height/2,radius*.36);
        core.addColorStop(0,'rgba(125,210,255,'+(.18+audio*.15+pulse*.05)+')');
        core.addColorStop(1,'rgba(35,130,220,0)');
        ctx.fillStyle=core;ctx.beginPath();ctx.arc(width/2,height/2,radius*.36,0,Math.PI*2);ctx.fill();ctx.restore();
        raf=requestAnimationFrame(draw);
      }
      raf=requestAnimationFrame(draw);
      return {
        setState(next){if(profiles[next])state=next;},
        setAnalyser(node){analyser=node;audioData=node?new Uint8Array(node.frequencyBinCount):null;},
        destroy(){destroyed=true;cancelAnimationFrame(raf);window.removeEventListener('resize',resize);},
      };
    }

    try {
      const { createOrb } = await import('./orb-network.js');
      orb = createOrb(canvas, { particleCount: 2000, maxLines: 8000, lineDistance: 8 });
      status.textContent = 'IDLE';
      hint.textContent = 'SELECT A STATE TO TEST THE NETWORK';
    } catch (error) {
      showFailure(error);
      try {
        orb = createFallbackOrb(canvas);
        hint.textContent = 'COMPATIBILITY PREVIEW / SELECT A STATE TO TEST THE NETWORK';
      } catch (fallbackError) {
        errorPanel.textContent += ' Compatibility renderer also failed: ' + (fallbackError?.message || fallbackError);
        hint.textContent = 'ORB COULD NOT START IN THIS BROWSER';
        buttons.forEach(button => button.disabled = true);
      }
    }

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        const state = button.dataset.state;
        orb?.setState(state);
        status.textContent = state.toUpperCase();
        buttons.forEach((item) => item.classList.toggle('active', item === button));
        hint.textContent = state === 'thinking'
          ? 'NETWORK ACTIVE / ENERGY PARTICLES TRAVELLING'
          : state === 'speaking'
            ? 'SPEAKING MODE / AUDIO-REACTIVE MOTION'
            : 'SELECT A STATE TO TEST THE NETWORK';
      });
    });

    micButton.addEventListener('click', async () => {
      if (microphoneStream) {
        microphoneStream.getTracks().forEach((track) => track.stop());
        microphoneStream = null;
        orb?.setAnalyser(null);
        if (audioContext) await audioContext.close();
        audioContext = null;
        micButton.textContent = 'Enable mic';
        micButton.classList.remove('active');
        hint.textContent = 'MICROPHONE DISABLED';
        return;
      }
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('Microphone access requires a secure browser context.');
        microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(microphoneStream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.72;
        source.connect(analyser);
        orb?.setAnalyser(analyser);
        micButton.textContent = 'Disable mic';
        micButton.classList.add('active');
        hint.textContent = 'MIC ACTIVE / SOUND WILL MOVE THE PARTICLES';
      } catch (error) {
        hint.textContent = 'MIC UNAVAILABLE / CHECK BROWSER PERMISSIONS';
        console.error(error);
      }
    });

    window.addEventListener('pagehide', () => {
      orb?.destroy();
      microphoneStream?.getTracks().forEach((track) => track.stop());
      if (audioContext) audioContext.close();
    }, { once: true });
  </script>
</body>
</html>
