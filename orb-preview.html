<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <title>JARVIS Orb Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050508; color: #eaf5ff; }
    body { min-height: 100svh; }
    #orb { display: block; width: 100%; height: 100%; position: absolute; inset: 0; }
    .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.32) 100%); }
    .top { position: absolute; top: max(18px, env(safe-area-inset-top)); left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .brand { letter-spacing: .22em; font-size: 11px; color: #a9cce7; opacity: .8; }
    .status { font-size: 11px; color: #8bbde2; text-transform: uppercase; letter-spacing: .16em; }
    .controls { position: absolute; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(94vw, 620px); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    button { appearance: none; border: 1px solid rgba(105,180,230,.25); background: rgba(8,20,34,.72); color: #cce8ff; border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 12px; letter-spacing: .04em; backdrop-filter: blur(12px); cursor: pointer; }
    button.active { border-color: rgba(125,205,255,.8); background: rgba(38,105,155,.42); color: white; box-shadow: 0 0 18px rgba(55,155,230,.18); }
    button:focus-visible { outline: 2px solid #8bd1ff; outline-offset: 3px; }
    .hint { position: absolute; bottom: max(82px, calc(env(safe-area-inset-bottom) + 78px)); left: 0; right: 0; text-align: center; color: rgba(180,215,240,.48); font-size: 10px; letter-spacing: .08em; pointer-events: none; }
    @media (max-width: 420px) { button { padding: 9px 12px; font-size: 11px; } .brand, .status { font-size: 9px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="orb" aria-label="Animated particle network orb"></canvas>
  <div class="vignette"></div>
  <div class="top"><div class="brand">J.A.R.V.I.S. / ORB LAB</div><div class="status" id="status">IDLE</div></div>
  <div class="hint" id="hint">SELECT A STATE TO TEST THE NETWORK</div>
  <div class="controls" aria-label="Orb preview controls">
    <button class="active" data-state="idle">Idle</button>
    <button data-state="listening">Listening</button>
    <button data-state="thinking">Thinking</button>
    <button data-state="speaking">Speaking</button>
    <button data-state="compacting">Compacting</button>
    <button id="mic">Enable mic</button>
  </div>
  <script type="module">
    import { createOrb } from './orb-network.js';

    const canvas = document.querySelector('#orb');
    const status = document.querySelector('#status');
    const hint = document.querySelector('#hint');
    const buttons = [...document.querySelectorAll('[data-state]')];
    const micButton = document.querySelector('#mic');
    const orb = createOrb(canvas, { particleCount: 2000, maxLines: 8000, lineDistance: 8 });

    let audioContext = null;
    let microphoneStream = null;

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        const state = button.dataset.state;
        orb.setState(state);
        status.textContent = state.toUpperCase();
        buttons.forEach((item) => item.classList.toggle('active', item === button));
        hint.textContent = state === 'thinking'
          ? 'NETWORK ACTIVE / ENERGY PARTICLES TRAVELLING'
          : state === 'speaking'
            ? 'SPEAKING MODE / AUDIO-REACTIVE MOTION'
            : 'SELECT A STATE TO TEST THE NETWORK';
      });
    });

    micButton.addEventListener('click', async () => {
      if (microphoneStream) {
        microphoneStream.getTracks().forEach((track) => track.stop());
        microphoneStream = null;
        orb.setAnalyser(null);
        if (audioContext) await audioContext.close();
        audioContext = null;
        micButton.textContent = 'Enable mic';
        micButton.classList.remove('active');
        hint.textContent = 'MICROPHONE DISABLED';
        return;
      }
      try {
        microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(microphoneStream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.72;
        source.connect(analyser);
        orb.setAnalyser(analyser);
        micButton.textContent = 'Disable mic';
        micButton.classList.add('active');
        hint.textContent = 'MIC ACTIVE / SOUND WILL MOVE THE PARTICLES';
      } catch (error) {
        hint.textContent = 'MIC UNAVAILABLE / CHECK BROWSER PERMISSIONS';
        console.error(error);
      }
    });

    window.addEventListener('pagehide', () => {
      orb.destroy();
      microphoneStream?.getTracks().forEach((track) => track.stop());
      if (audioContext) audioContext.close();
    }, { once: true });
  </script>
</body>
</html>
