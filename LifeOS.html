<style>

<script>
/* Temporary startup diagnostics: show the actual runtime error instead of a silent blank screen. */
(function(){
  function showLifeOSError(message){
    try{
      let box=document.getElementById('lifeos-runtime-error');
      if(!box){
        box=document.createElement('pre');
        box.id='lifeos-runtime-error';
        box.style.cssText='position:fixed;z-index:2147483647;inset:12px;padding:16px;overflow:auto;white-space:pre-wrap;background:#190f16;color:#ffd6df;border:1px solid #ff5478;border-radius:8px;font:13px/1.5 monospace';

      }
      box.textContent='LifeOS could not start. Please send this error:\n'+message;
    }catch(_){}
  }
  window.addEventListener('error',function(e){showLifeOSError((e.message||'Script error')+'\n'+(e.filename||'')+':'+(e.lineno||'?')+':'+(e.colno||'?'));});
  window.addEventListener('unhandledrejection',function(e){showLifeOSError('Unhandled promise rejection: '+(e.reason&&e.reason.stack||e.reason||'Unknown error'));});
})();

const K='lifeos.v1',$=s=>document.querySelector(s);
const CATS={sc:{n:'Self-Care',d:'Routine and daily wellbeing',i:'✨'},in:{n:'Intelligence',d:'Learning and knowledge',i:'🧠'},bb:{n:'Basketball',d:'Game performance',i:'🏀'},ph:{n:'Physical',d:'Athletic capabilities',i:'⚡'}};
const ATTR={sc:['Hygiene','Style','Routine','Consistency'],in:['Academics','Learning','Knowledge','Problem-Solving'],bb:['Scoring','Playmaking','Defense','Rebounding','Efficiency'],ph:['Speed','Agility','Vertical','Stamina','Strength']};
const XPV={quest:10,game:20,test:15,acad:15}; // default XP values
const need=l=>50*l*(l-1); // total XP required to reach level l (single source of truth)
const lvl=t=>{let l=1;while(t>=need(l+1))l++;return l};
const band=v=>v<20?'Beginner':v<40?'Developing':v<60?'Intermediate':v<75?'Strong':v<90?'Excellent':'Elite';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const td=()=>fmt(new Date()),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return fmt(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,r1=v=>v==null?'—':Math.round(v*10)/10;
let S,R='dash',TAB='Achievements',RANGE=30;
const TDEFS=[['10m sprint','Speed','s',1],['20m sprint','Speed','s',1],['5-10-5 shuttle','Agility','s',1],['Standing vertical','Vertical','cm',0],['1.5km run','Stamina','min',1],['Max push-ups','Strength','reps',0],['Max squat','Strength','lb',0],['Max bench press','Strength','lb',0],['Max bicep curl','Strength','lb',0]].map(a=>({n:a[0],a:a[1],u:a[2],low:a[3]}));
const blank=()=>({v:1,name:ONB.name||'You',theme:'dark',demo:false,xp:[],quests:[{id:'q1',t:'Morning hygiene',on:1},{id:'q2',t:'Read for 10 minutes',on:1},{id:'q3',t:'Review something learned',on:1},{id:'q4',t:'Evening routine',on:1}],done:{},rat:{},rh:[],games:[],tests:[],acad:[],water:{},wt:2000,ach:{},nodes:{},ui:{},ps:[],iq:[],study:[],ht:[],tr:0,food:{},sg:{},sport:ONB.sport,pos:ONB.pos,jn:ONB.jn,lv:1,lxp:0,tdefs:TDEFS,w:{sc:1,in:1,bb:1,ph:1}});
try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save – storage unavailable')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function modal(h){$('#mb').innerHTML=h;$('#modal').classList.add('on')}function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id=='modal'&&S)closeM()};
function ask(msg,fn){modal(`<h3>Confirm</h3><p>${msg}</p><div class=row><button class=b onclick="closeM();ASK()">Yes</button><button class="b g" onclick=closeM()>Cancel</button></div>`);window.ASK=fn}
/* ratings */
const rk=(c,i)=>(c=='bb'&&S&&S.sport&&S.sport!='bb'?'bb:'+S.sport:c)+'.'+ATTR[c][i],RV=(c,i)=>S&&S.rat?S.rat[rk(c,i)]:null;
function catR(c){const v=ATTR[c].map((_,i)=>RV(c,i)).filter(x=>x!=null);return v.length?Math.round(mean(v)):null}
function overall(){let s=0,w=0;for(const c in CATS){const v=catR(c);if(v!=null){s+=v*S.w[c];w+=S.w[c]}}return w?Math.round(s/w):null} // weighted mean of category ratings (weights in S.w, default equal)
function setRat(k,v,src){v=Math.round(Number(v));if(!(v>=0&&v<=99))return false;const o=S.rat[k];if(o===v)return true;S.rat[k]=v;S.rh.push({k,f:o??null,t:v,d:new Date().toISOString(),s:src});return true}
function ovHist(){return S.rh.length}
/* xp + achievements */
const xpT=()=>S.xp.reduce((a,e)=>a+e.a,0);
function addXp(k,a,w,t,f){if(S.xp.some(e=>e.k===k))return;const T=t||[],E=T.includes('in.Learning')&&!T.includes('in.Knowledge')?[...T,'in.Knowledge']:T,lv=p=>Math.floor(Math.max(0,p)/100+1e-9),b=E.map(pool);S.xp.push({k,a,w,d:new Date().toISOString(),t:t||null,f:f?1:0});E.forEach((x,i)=>{const g=lv(pool(x))-lv(b[i]);if(g){setRat(x,Math.max(0,Math.min(99,(S.rat[x]??0)+g)),'Attribute XP');toast(x.split('.')[1]+' '+(g>0?'+':'')+g)}})} // key makes each award one-time; deleting records keeps earned XP
if(S){S.nodes=S.nodes||{};S.ui=S.ui||{};S.ps=S.ps||[];S.iq=S.iq||[];S.study=S.study||[];S.ht=S.ht||[];S.food=S.food||{};S.sg=S.sg||{};TDEFS.forEach(d=>{if(S.tdefs&&!S.tdefs.some(x=>x.n==d.n))S.tdefs.push({...d})});S.tr=S.tr??tierRank(overall());(S.tdefs||[]).forEach(d=>{if(d.n=='1.5km run'&&d.u=='s'){d.u='min';S.tests.forEach(t=>{if(t.name==d.n&&t.val>60)t.val=Math.round(t.val/60*100)/100})}});S.lv=S.lv||lvl(xpT());S.lxp=S.lxp??xpT()}const days=()=>Object.keys(S.done).filter(d=>S.done[d].length).sort();
function run(ds){let m=0,c=0,p=null;ds.forEach(d=>{c=p&&(new Date(d)-new Date(p))/864e5==1?c+1:1;p=d;m=Math.max(m,c)});return m}
function recBroke(f){const g=S.games.filter(x=>x[f]!=null).sort((a,b)=>a.date.localeCompare(b.date));let m=-1;for(const x of g){if(m>=0&&x[f]>m)return true;m=Math.max(m,x[f])}return false}
function pbs(){const o={};S.tdefs.forEach(d=>{const t=S.tests.filter(x=>x.name==d.n).sort((a,b)=>a.date.localeCompare(b.date));if(!t.length)return;const b=t.reduce((x,y)=>(d.low?y.val<x.val:y.val>x.val)?y:x);const i=t.indexOf(b);o[d.n]={d,b,prev:i>0?t[i-1]:null,t}});return o}
const ACH=[['first_step','First Step','🌱','Complete your first quest','',20,()=>days().length>0],['streak7','Seven-Day Streak','🔥','Complete a quest on 7 consecutive days','',50,()=>run(days())>=7],['lvl2','Level Up','⬆️','Reach level 2','',0,()=>lvl(xpT())>=2],
['hyd','Hydration Habit','💧','Hit your water target on 3 days','sc',30,()=>Object.values(S.water).filter(v=>v>=S.wt).length>=3],
['acad','Academic Progress','📈','Beat a previous result in a subject','in',30,()=>S.acad.some(a=>S.acad.some(b=>b.sub==a.sub&&b.date<a.date&&a.pct>b.pct))],
['g1','First Game','🏀','Record your first game','bb',20,()=>mat().length>0],['pts','New Scoring Record','🎯','Beat your points record','bb',30,()=>recBroke('pts')],['ast','Playmaker','🤝','Set a new assists record','bb',30,()=>recBroke('ast')],['def','Defensive Impact','🛡️','Set a new steals or blocks record','bb',30,()=>recBroke('stl')||recBroke('blk')],
['t1','First Test','⏱️','Record your first athletic test','ph',20,()=>S.tests.length>0],['pb','New Personal Best','🏅','Improve on a previous result','ph',30,()=>Object.values(pbs()).some(p=>p.prev&&p.b.id!=p.t[p.t.length-1].id?false:p.prev&&(p.d.low?p.b.val<p.prev.val:p.b.val>p.prev.val)&&p.b.id==p.t[p.t.length-1].id)]];
function evalAch(){if(S.demo)return;evalNodes();ACH.filter(a=>SPID()=='bb'||!['pts','ast','def'].includes(a[0])).forEach(a=>{if(!S.ach[a[0]]&&a[6]()){S.ach[a[0]]=new Date().toISOString();addXp('a:'+a[0],a[5],'Achievement: '+a[1],a[4]?ak(a[4]):null);toast('Unlocked: '+a[1])}})}
function commit(){evalAch();const t=xpT(),L=lvl(t),p=S.lv||1,g=t-(S.lxp??t),tr=tierRank(overall()),up=tr>(S.tr||0);S.lxp=t;S.lv=L;S.tr=tr;save();render();if(up)PT=tr;if(L>p)showLU(p,L,g);else if(up)showTier()}
/* evidence-based suggestions (never applied automatically) */

 modal(`<p class=mu>${P.i} Question ${i+1} of ${n}</p><div class=bar style='--c:var(--ph);margin-bottom:12px'><i style='width:${i/n*100}%'></i></div><h3>${esc(q.q)}</h3>`+(q.o?q.o.map((o,j)=>`<button class=at onclick=onqA(${i},${j})>${esc(o)}</button>`).join(''):`<div class=row><input id=qv type=number step=any min=0 placeholder='${q.h||''}' style='flex:2'>${q.u.length>1?`<select id=qu style='flex:1'>${q.u.map((u,k)=>`<option value=${k}>${u[0]}</option>`).join('')}</select>`:`<b>${q.u[0][0]}</b>`}</div><p id=er class=er></p><button class=b onclick=onqN(${i})>Next</button>`)+`<div class=row style='margin-top:12px'>${i?`<button class='b g s' onclick=onqBack(${i})>Back</button>`:''}<span class=sp></span><button class='b g s' onclick=onqSkip(${i})>Skip</button></div>`)}
function onqNext(i,d){let n=i+d;if(n==3&&ONB.noR)n=d>0?4:2;onq(n)}
function onqA(i,j){QR[i]=qList()[i].r[j];if(i==2){ONB.noR=j==0;if(ONB.noR)QR[3]=35}onqNext(i,1)}
function onqSkip(i){QR[i]=null;if(i==2)ONB.noR=false;onqNext(i,1)}
function onqBack(i){onqNext(i,-1)}
function onqN(i){const q=qList()[i],u=$('#qu'),v=+$('#qv').value*q.u[u?+u.value:0][1];if(!(v>=q.g[0]&&v<=q.g[1])){$('#er').textContent='Enter a realistic value, or tap Skip.';return}QR[i]=q.f(v);onqNext(i,1)}
function qRes(){const m={};qList().forEach((q,i)=>{if(QR[i]!=null)(m[q.t]=m[q.t]||[]).push(QR[i])});const o=Object.fromEntries(Object.entries(m).map(([k,v])=>[k,Math.round(mean(v))]));o['ph.Agility']=o['ph.Speed']??60;return o}
function onqEnd(){const R=qRes(),P=SPORTS[ONB.sport],nm=k=>k.startsWith('bb#')?P.at[+k.slice(3)]:k.split('.')[1];modal(`<h3>Your starting ratings</h3><p class=mu>Estimated from your answers. Adjust them any time; they change as you log real results.</p><div class=row>${Object.entries(R).map(([k,v])=>`<span class=tag>${nm(k)} ${v}</span>`).join('')||'<span class=mu>No answers given.</span>'}</div><br><div class=row><button class=b onclick=onqStart()>Start LifeOS</button><button class='b g' onclick=sample()>Use sample data instead</button></div><br><button class='b g s' onclick=onqBack(${qList().length})>Back</button>`)}
function onqStart(){const R=qRes();S=blank();applySport();for(const k in R)setRat(k.startsWith('bb#')?rk('bb',+k.slice(3)):k,R[k],'Starting questionnaire');if(ONB.bw)S.bw=ONB.bw;S.tr=tierRank(overall());closeM();save();render()}
function restartSetup(){ask('This deletes all your LifeOS data and restarts setup from the sport question. Export first if you want a backup.',()=>{S=null;ONS=0;QR={};try{localStorage.removeItem(K)}catch(e){}closeM();render()})}
/* shell */
const PAGES={dash:['Dashboard','▦',dash],sc:['Self-Care','✨',selfCare],in:['Intelligence','🧠',intel],bb:['Basketball','🏀',hoops],ph:['Physical','⚡',phys],ach:['Achievements','🏅',achv],hist:['History','📊',hist],set:['Settings','⚙️',sett]};
PAGES.prog=['Progress','🏅',hist];const LB={dash:'Home',sc:'Care',in:'Mind',bb:'Hoops',ph:'Body',prog:'Progress'};PAGES.food=['Nutrition','🍽️',nutr];function go(p){R=p;render();scrollTo(0,0)}
function render(){if(!S){onb(ONS);return}if(0){modal(`<h3>Welcome to LifeOS</h3><p class=mu>Turn everyday life into a progression system. Data stays in this browser.</p><div class=row><button class=b onclick=sample()>Start with sample data</button><button class="b g" onclick="S=blank();closeM();save();render()">Start clean</button></div>`);return}
 const m=matchMedia('(prefers-color-scheme: dark)').matches,t=S.theme=='system'?(m?'dark':'light'):S.theme;document.documentElement.dataset.theme=t;applySport();
 $('#nav').innerHTML=Object.entries(PAGES).filter(([k])=>LB[k]).map(([k,p])=>`<button class="${k==R?'on':''}" style="--c:var(--${CATS[k]?k:'tx'})" onclick="go('${k}')"><b>${p[1]}</b>${LB[k]}</button>`).join('');
 $('#app').innerHTML=`<div class=top><div><h1>LifeOS</h1><small>${new Date().toDateString()} · Your progression</small></div><span class=sp></span><span class=mu>Lv ${lvl(xpT())} · ${xpT()} XP</span><button class="b g s" aria-label=Settings onclick="go('set')">⚙️</button><div class=av>${esc(S.name[0]||'Y').toUpperCase()}</div></div>${CATS[R]?`<div class=catp style="--c:var(--${R})">${PAGES[R][2]()}</div>`:PAGES[R][2]()}`}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S)render()});render();
</script></body></html>
