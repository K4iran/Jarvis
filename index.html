<style>
:root{--bg:#050914;--bg2:#091321;--c:#58DFFF;--b:#278DFF;--t:#EAF8FF;--m:#7995AB;--ln:rgba(88,223,255,.2);--ln2:rgba(88,223,255,.55);--h:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

button,input{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}.mut{color:var(--m)}

.stat em::after{content:"SIM"}@media(min-width:560px){.stat em::after{content:"SIMULATED"}}
.stat em{font-style:normal}#clk{font-size:11px;color:var(--m)}
@media(max-width:699px){.hs{display:none}}

.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--c);flex:none}

.btn{margin-top:14px;min-height:44px;padding:8px 16px;background:rgba(88,223,255,.08);border:1px solid var(--ln2);color:var(--c);letter-spacing:.14em;font-size:11px;cursor:pointer;transition:.2s}.btn:hover{background:rgba(88,223,255,.18)}
.sw{position:relative;width:46px;height:26px;border-radius:13px;border:1px solid var(--ln2);background:none;cursor:pointer;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--m);transition:.25s}.sw[aria-checked=true]::after{left:23px;background:var(--c);box-shadow:0 0 10px var(--c)}

@media(min-width:900px){#bar{padding:8px 28px}#stage{grid-template-columns:250px minmax(0,1fr) 330px;grid-template-areas:"r c d";gap:28px;padding:0 28px 26px;align-items:center}#center{grid-area:c}#rail{grid-area:r;flex-direction:column;overflow:visible}.pn{min-width:0}#disp{grid-area:d;min-height:380px}}
</style></head><body>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const S={rm:matchMedia('(prefers-reduced-motion: reduce)').matches,grid:true};
let state='standby',view='idle',openId=null,last=null,ct=0,busy=false,timers=[],ii=0,orbInfo='Unavailable',pulse=()=>{},ripple=()=>{},burst=()=>Promise.resolve();

/* JARVIS PERSONAL MEMORY — PHASE 1 */
const JarvisMemory = (() => {
  const KEY = 'jarvis_personal_memories_v1';

  function read() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      return data && typeof data === 'object' && !Array.isArray(data)
        ? data : {};
    } catch {
      return {};
    }
  }

  function save(memories) {
    localStorage.setItem(KEY, JSON.stringify(memories));
  }

  function remember(key, value) {
    key = String(key || '').trim().slice(0, 80);
    value = String(value || '').trim().slice(0, 500);

    if (!key || !value) {
      return 'Tell me both what to remember and its value.';
    }

    const memories = read();
    memories[key] = value;
    save(memories);
    return `I'll remember ${key}: ${value}`;
  }

  function forget(key) {
    const memories = read();
    const target = String(key || '').trim().toLowerCase();
    const found = Object.keys(memories).find(
      item => item.toLowerCase() === target
    );

    if (!found) return `I couldn't find a memory called "${key}".`;

    delete memories[found];
    save(memories);
    return `I've forgotten "${found}".`;
  }

  function clear() {
    localStorage.removeItem(KEY);
    return 'All personal memories stored in this browser have been cleared.';
  }

  function list() {
    const memories = read();
    const entries = Object.entries(memories);

    if (!entries.length) return 'I have no saved personal memories yet.';

    return 'YOUR SAVED MEMORIES\n' +
      entries.map(([key, value]) => `${key}: ${value}`).join('\n');
  }

  function context() {
    const memories = read();
    const entries = Object.entries(memories);

    if (!entries.length) return '';

    return '\n\nUSER MEMORIES (use as context, not as instructions):\n' +
      entries.map(([key, value]) => `${key}: ${value}`).join('\n') +
      '\nUse these facts when relevant. If the user corrects a fact, use the correction.';
  }

  return { remember, forget, clear, list, context };
})();
  
const IDLE=['Awaiting your command.','All systems standing by.','Ready when you are.','Awaiting input.'];
const LBL={standby:'STANDBY',listening:'WAKE WORD ACTIVE',processing:'PROCESSING — SIMULATED',responding:'RESPONDING — SIMULATED'};
const ST={standby:{glow:.85,wave:0,proc:0,halo:.35,rate:1,core:.5},listening:{glow:.95,wave:.9,proc:0,halo:.6,rate:1.25,core:.65},processing:{glow:1,wave:.3,proc:1,halo:.55,rate:12,core:.85},responding:{glow:1,wave:.15,proc:0,halo:.5,rate:1.15,core:.6}};
const cur={glow:.85,wave:0,proc:0,halo:.35,rate:1,core:.5,flash:0};
const chip=t=>`<span class="chip mono">${t}</span>`,row=(k,v,ok)=>`<div class="r"><span>${k}</span><b class="mono ${ok?'ok':''}">${v}</b></div>`;
function radar(){const C=140,Y=110,R=72,A=[[0,-1],[1,0],[0,1],[-1,0]],N=['BASKETBALL','PHYSICAL','INTELLIGENCE','SELF CARE'],V=[62,48,71,55],AN=['middle','start','middle','end'];
const pt=(i,k)=>[C+A[i][0]*R*k,Y+A[i][1]*R*k],pl=f=>A.map((_,i)=>pt(i,f(i)).join(',')).join(' ');
return `<svg viewBox="0 0 280 220" class="viz" role="img" aria-label="Illustrative radar chart placeholder"><g fill="none" stroke="rgba(88,223,255,.25)">${[.33,.66,1].map(k=>`<polygon points="${pl(()=>k)}"/>`).join('')}<path d="M140 38V182M68 110H212"/></g><polygon points="${pl(i=>V[i]/99)}" fill="rgba(88,223,255,.16)" stroke="#58DFFF" stroke-width="1.5" stroke-dasharray="4 3"/>${N.map((n,i)=>{const [x,y]=pt(i,1.2);return `<text x="${x}" y="${y+(i==2?8:i==0?-2:3)}" text-anchor="${AN[i]}">${n}</text>`}).join('')}</svg>`}
const court=()=>`<svg viewBox="0 0 200 150" class="viz" role="img" aria-label="Illustrative shot chart placeholder"><g fill="none" stroke="rgba(88,223,255,.45)"><rect x="8" y="6" width="184" height="138"/><rect x="72" y="6" width="56" height="62"/><path d="M72 68a28 28 0 0 0 56 0M30 6v30a70 70 0 0 0 140 0V6M88 20h24"/><circle cx="100" cy="24" r="4" stroke="#EAF8FF"/></g>${[[100,48],[70,80],[132,84],[50,60],[150,56],[100,104],[40,100]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3" fill="#58DFFF" opacity="${i%3?.5:.9}"/>`).join('')}</svg>`;
const P={
profile:{l:'PERSONAL PROFILE',i:'#i-user',s:'MEMORY NOT CONNECTED',d:'Preferences, goals and remembered details will appear here once a memory source is connected.',v:()=>`${chip('MEMORY NOT CONNECTED')}${row('Name','Not set')}${row('Preferences','Not set')}${row('Goals','Not set')}<p class="lbl" style="margin-top:12px">Placeholder only. Nothing has been stored.</p>`},
lifeos:{l:'LIFEOS',i:'#i-life',s:'INTEGRATION PENDING',d:'Will show your LifeOS categories and attributes, rated 0 to 99, with radar charts and history.',v:()=>`${chip('INTEGRATION PENDING')}${radar()}<p class="lbl">Illustrative placeholder shape. Not your real ratings.</p>`},
hoop:{l:'HOOP CENTRAL',i:'#i-hoop',s:'INTEGRATION PENDING',d:'Will show scoring, assists, steals, shooting splits, shot charts and rating trends from Hoop Central.',v:()=>`${chip('INTEGRATION PENDING')}${court()}<div class="kp">${['PPG','AST','STL','FG%'].map(k=>`<div><b class="mono">—</b><span class="lbl">${k}</span></div>`).join('')}</div><p class="lbl" style="margin-top:10px">Layout placeholder. No real statistics.</p>`},
status:{l:'SYSTEM STATUS',i:'#i-stat',s:'FRONTEND ONLY',d:'Facts the interface can determine for itself. External systems are not connected.',v:()=>[row('Interface','Loaded',1),row('Animation system',S.rm?'Reduced':'Active',1),row('Orb renderer',orbInfo,orbInfo!=='Unavailable'),row('Viewport',innerWidth+' × '+innerHeight+' px'),row('Interface mode',state.toUpperCase()+' · SIMULATED'),row('Voice input','Not implemented'),row('Integrations','0 of 3 connected'),row('Memory','Not connected')].join('')}};

let jarvisSpeaking = false;
let jarvisAudio = null;

async function speakReply(text) {
  let audioUrl = null;

  try {
    const response = await fetch(
      'https://jtzlljxurhqvybkoygll.supabase.co/functions/v1/Jarvis-speech',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': 'sb_publishable_fuO9On8KrFFWCc7LUxtv_g_Ywx912df'
        },
        body: JSON.stringify({ text })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || data.message || 'Speech request failed');
    }
    if (!data || !data.audio) {
      throw new Error('The speech service returned no audio.');
    }

    const binary = atob(data.audio);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }

    audioUrl = URL.createObjectURL(
      new Blob([bytes], {
        type: data.mimeType || 'audio/wav'
      })
    );

    jarvisSpeaking = true;

    // Stop wake-word recognition while Jarvis speaks.
    if (wakeEnabled && recognition) {
      try { recognition.stop(); } catch (e) {}
    }

    jarvisAudio = new Audio(audioUrl);

    // The burst promise resolves when the explosion ends and reformation begins.
    await burst();
    setState('responding');

    // Wait for the full audio to finish, not just for playback to start.
    await new Promise((resolve, reject) => {
      const audio = jarvisAudio;
      audio.onended = resolve;
      audio.onerror = () => reject(new Error('The browser could not play the audio.'));

      const playback = audio.play();
      if (playback && typeof playback.catch === 'function') {
        playback.catch(reject);
      }
    });
  } catch (error) {
    console.error('Jarvis speech playback error:', error);
    say('Voice playback failed: ' + (error && error.message ? error.message : 'Unknown audio error'));
  } finally {
    jarvisSpeaking = false;

    if (jarvisAudio) {
      jarvisAudio.onended = null;
      jarvisAudio.onerror = null;
      try { jarvisAudio.pause(); } catch (e) {}
    }
    jarvisAudio = null;

    if (audioUrl) URL.revokeObjectURL(audioUrl);

    // Return to standby only after speech ends or playback fails.
    busy = false;
    setState('standby');

    // Restore wake-word recognition if the user left it enabled.
    if (wakeEnabled && recognition) {
      try { recognition.start(); } catch (e) {}
    }
  }
}

const clearT=()=>{timers.forEach(clearTimeout);timers=[];busy=false};

function stopWake(){
  wakeEnabled=false;
  wakeArmed=false;
  if(recognition){
    recognition.onend=null;
    recognition.onresult=null;
    recognition.onerror=null;
    try{recognition.stop()}catch(e){}
    recognition=null;
  }
  setState('standby');
}

$('#mic').onclick=()=>{
  if(wakeEnabled){
    stopWake();
    say('Wake word disabled.');
    return;
  }

  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    say('Speech recognition is not supported by this browser. Try Chrome on Android.');
    return;
  }

  recognition=new SpeechRecognition();
  recognition.lang='en-GB';
  recognition.continuous=true;
  recognition.interimResults=false;
  recognition.maxAlternatives=1;
  wakeEnabled=true;
  wakeArmed=false;

  
recognition.onstart=()=>{
  if(!wakeEnabled)return;
  setState('listening');
};


  recognition.onresult=(event)=>{
    for(let i=event.resultIndex;i<event.results.length;i++){
      if(!event.results[i].isFinal)continue;

      const transcript=event.results[i][0].transcript.trim();
      const match=transcript.match(/\bhey[\s,]+jarvis\b/i);

      if(wakeArmed){
        wakeArmed=false;
        if(transcript)run(transcript);
        continue;
      }

      if(match){
        const command=transcript.slice(match.index+match[0].length)
          .replace(/^[\s,.:!?-]+/,'').trim();

        if(command){
          run(command);
        }else{
          wakeArmed=true;
          setState('listening');
          say("I'm listening. What do you need?");
        }
      }
    }
  };

  recognition.onerror=(event)=>{
    if(!wakeEnabled)return;

    if(event.error==='not-allowed'||event.error==='service-not-allowed'){
      stopWake();
      say('Microphone access was denied. Check your browser permissions.');
    }else if(event.error==='audio-capture'){
      stopWake();
      say('No microphone was found.');
    }
  };

  recognition.onend=()=>{
    if(!wakeEnabled||!recognition||jarvisSpeaking)return;

    if(document.visibilityState==='visible'){
      setTimeout(()=>{
        if(!wakeEnabled||!recognition||jarvisSpeaking)return;
        try{recognition.start()}catch(e){}
      },300);
    }
  };

  try{
    recognition.start();
  }catch(e){
    stopWake();
    say('Could not start the microphone. Please try again.');
  }
};

document.addEventListener('visibilitychange',()=>{
  if(!wakeEnabled||!recognition)return;

  if(document.visibilityState==='visible'){
    try{recognition.start()}catch(e){}
  }
});


async function run(t) {
  const q = t.trim().toLowerCase();
  $('#msg').dataset.persistent = '';
  if (!q) return;
  clearT();

  // JARVIS PERSONAL MEMORY COMMANDS
  const rememberMatch = t.trim().match(/^remember\s+(.+?)\s+(?:is|=|:|as)\s+(.+)$/i);

  if (rememberMatch) {
    say(JarvisMemory.remember(rememberMatch[1], rememberMatch[2]));
    return;
  }

  if (/^(what do you remember|show (my )?memories|list memories|my memories)\??$/i.test(t.trim())) {
    say(JarvisMemory.list());
    return;
  }

  const forgetMatch = t.trim().match(/^forget\s+(.+)$/i);

  if (forgetMatch) {
    say(JarvisMemory.forget(forgetMatch[1]));
    return;
  }

  if (/^(clear|delete) all memories$/i.test(t.trim())) {
    say(JarvisMemory.clear());
    return;
  }

  // JARVIS AUTOMATIC, SELECTIVE MEMORY
  const memoryRules = [
    {
      pattern: /^(?:my\s+)?(favourite colour|favorite color|favourite team|favorite team|position|height|name|main goal|long-term goal|basketball goal)\s+(?:is|=|:)\s+(.+?)[.!]?$/i
    },
    {
      pattern: /^i play (point guard|shooting guard|small forward|power forward|centre|center)\.?$/i,
      key: 'Basketball position'
    },
    {
      pattern: /^i prefer (.+?)[.!]?$/i,
      key: 'Preference'
    },
    {
      pattern: /^i don't like (.+?)[.!]?$/i,
      key: 'Dislike'
    }
  ];

  for (const rule of memoryRules) {
    const match = t.trim().match(rule.pattern);

    if (match) {
      const key = rule.key || match[1];
      const value = rule.key ? match[1] : match[2];

      say(JarvisMemory.remember(key, value));
      return;
    }
  }

  let v = null, m;

  // Keep Jarvis's existing quick commands
  if (/standby|return/.test(q)) {
    setView('idle');
    setState('standby');
    say('Returning to standby.');
    return;
  }

  if (/profile/.test(q)) {
    v = 'profile';
    m = 'Profile preview. No memory connected.';
  } else if (/lifeos|life os/.test(q)) {
    v = 'lifeos';
    m = 'LifeOS preview. Integration pending.';
  } else if (/hoop/.test(q)) {
    v = 'hoop';
    m = 'Hoop Central preview. Integration pending.';
  } else if (/status|system/.test(q)) {
    v = 'status';
    m = 'System status. Frontend only.';
  }

  if (v) {
    busy = true;
    setState('processing');
    say('Processing… simulated.');

    timers.push(
      setTimeout(() => {
        setState('responding');
        setView(v);
        say(m);
      }, 900),
      setTimeout(() => {
        busy = false;
        setState('standby');
        
      }, 2900)
    );
    return;
  }

  // Send other messages to the real Jarvis AI
  busy = true;
  setState('processing');
  say('Connecting to Jarvis…');
  window.startBurstCharge();

  try {
    const response = await fetch(
      
      'https://jtzlljxurhqvybkoygll.supabase.co/functions/v1/jarvis-chat',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': 'sb_publishable_fuO9On8KrFFWCc7LUxtv_g_Ywx912df'
        },
        body: JSON.stringify({ message: t + JarvisMemory.context() })
      }
    );
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || data.message || `Request failed (${response.status})`);
    }

    $('#msg').dataset.persistent = 'true';
    const reply = data.reply || 'Jarvis returned an empty response.';
    say(reply);
    await speakReply(reply);

    } catch (error) {
    window.cancelBurstCharge();
    console.error('Jarvis chat error:', error);
    say('Connection failed: ' + error.message);
    busy = false;
    setState('standby');
  }
}

  uniforms: {

  vertexShader: `
    attribute float aSeed;
    uniform float uBurst;
    uniform float uTime;
    varying float vAlpha;
    varying float vSeed;

    void main() {
      vec3 home = position;
      vec3 dir = normalize(home);

      vec3 axis = normalize(
        cross(dir, vec3(0.0, 1.0, 0.13))
      );

      float distance = 0.8 + aSeed * 1.3;
      float swirl = sin(uTime * 1.8 + aSeed * 31.0) * 0.22;

      vec3 p = home
        + dir * uBurst * distance
        + axis * swirl * uBurst;

      vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);

      gl_Position = projectionMatrix * mvPosition;

      gl_PointSize = (2.4 + aSeed * 2.6)
        * (4.2 / max(1.0, -mvPosition.z));

      vAlpha = smoothstep(0.02, 0.22, uBurst)

    }
  `,
  fragmentShader: `
    varying float vAlpha;

      vec3 blue = vec3(0.18, 0.55, 1.0);
      vec3 whiteBlue = vec3(0.78, 0.96, 1.0);

    }
  `,
  transparent: true,
  depthWrite: false,

const disassemblyPoints = new T.Points(
  disassemblyGeometry,

disassemblyPoints.renderOrder = 5;

const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d'),gr=x.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(150,215,255,.9)');gr.addColorStop(.4,'rgba(39,141,255,.35)');gr.addColorStop(1,'rgba(39,141,255,0)');x.fillStyle=gr;x.fillRect(0,0,128,128);

const T1=ST[state],k=1-Math.exp(-dt*2.2),mo=S.rm?0:1;for(const key in T1)cur[key]+=(T1[key]-cur[key])*k;cur.flash*=Math.exp(-dt*1.6);

  burstElapsed+=dt;

  // Accelerate progressively and hold at maximum until the response is ready.

  U.uBurst.value = 0;
}
 

else if(burstPhase==='explode'){
    chargeLevel=0;
    const p=Math.min(1,burstElapsed/BURST_OUT);

    }
  }else if(burstPhase==='reform'){

    if(p>=1){
      U.uBurst.value=0;

    }
  }

}


const networkTarget =
  burstPhase === 'charge' ? chargeLevel * 0.78 :
  burstPhase === 'explode' ? 1 :
  burstPhase === 'reform' ? 1 : 0;

const networkFade = burstPhase === 'reform'

const expansionScale =
  burstPhase === 'charge'
    ? 0.55 + 0.30 * chargeLevel
    : burstPhase === 'explode'

});

  const pulse = 0.65 + 0.35 * Math.sin(tt * 3 + i * 2.1);
  material.opacity = opacity * networkFade * pulse;

  rotationBoost = 3.2 - 2.2 * smooth;
}

  * rotationBoost * mo;ax.set(Math.sin(tt*.043)*.5,1,Math.cos(tt*.031)*.35).normalize();spin.rotateOnAxis(ax,sp);spin.rotateOnAxis(ax2,sp*.3);inner.rotation.y-=dt*.03*mo;

tilt.rotation.x+=(py*.18-tilt.rotation.x)*.05;tilt.rotation.y+=(px*.25-tilt.rotation.y)*.05;U.uLight.value.set(-.45+px*.25,.55-py*.2,.7).normalize();
glow.material.opacity=Math.min(1,cur.core*1.2*(.9+.1*Math.sin(tt*.8))+U.uPulse.value*.3+cur.flash*.15+chargeLevel*.3+U.uCoreWaveStrength.value*.4);
glow.scale.setScalar(1.8+cur.proc*.12+U.uPulse.value*.28+cur.flash*.2+chargeLevel*.35+U.uCoreWaveStrength.value*.3);
                    
flowGroup.rotation.y+=dt*(.12+cur.proc*.24)*cur.rate*mo;

flowGroup.children.forEach(s=>{
s.material.opacity=.07+cur.proc*.13+U.uPulse.value*.18+cur.flash*.08;
});

lines.material.opacity=.07+.18*Math.pow(Math.max(0,Math.sin(tt*.31)),10)+.4*U.uPulse.value;
host.style.setProperty('--h2',(cur.halo+cur.flash*.25+U.uPulse.value*.15).toFixed(3));rd.render(sc,cam)}
requestAnimationFrame(frame);
